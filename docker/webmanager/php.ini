expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 128M
post_max_size = 130M
max_file_uploads = 50
max_execution_time = 60
default_charset = "UTF-8"
date.timezone = UTC
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,mail
open_basedir = /srv/webmanager:/tmp:/dev/urandom
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
