worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log off;
    client_max_body_size 130m;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Only the reverse proxy (private Docker networks) can reach this server, and it sets X-Real-IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    map $http_x_forwarded_proto $fcgi_https { default ""; https on; }

    server {
        listen 8080 default_server;
        root /srv/webmanager/public;

        add_header X-Content-Type-Options nosniff always;

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ \.php$ { return 404; }

        # a 404 that nginx itself produces (a missing file below /assets/, a direct request for a .php file) gets the branded page of the dashboard
        error_page 404 /_wm_404;
        location = /_wm_404 {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /srv/webmanager/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param QUERY_STRING "";
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param REQUEST_URI /_wm_404;
            fastcgi_param CONTENT_TYPE "";
            fastcgi_param CONTENT_LENGTH "";
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param HTTPS $fcgi_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param REDIRECT_STATUS 200;
        }

        location / {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
            fastcgi_param SCRIPT_FILENAME /srv/webmanager/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param HTTPS $fcgi_https;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param REDIRECT_STATUS 200;
        }
    }
}
