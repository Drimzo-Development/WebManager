worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # Slow-client protection: connections that stall while sending headers or bodies are closed early.
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    server_names_hash_bucket_size 128;

    # Containers are resolved at request time through Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Behind another reverse proxy that terminates HTTPS (Pangolin, Traefik, Cloudflare ...) the scheme and the host the visitor used are
    # only known from its X-Forwarded-* headers. They are passed on instead of being overwritten with this proxy's own (plain http) values.
    # Only "https" is taken over (a spoofed value can at most make a connection look more secure to the application, never less) and
    # the host only if it looks like a host name.
    map $http_x_forwarded_proto $wm_forwarded_proto { default $scheme; https https; }
    map $http_x_forwarded_host $wm_forwarded_host { default $host; "~^[A-Za-z0-9.:-]{1,255}$" $http_x_forwarded_host; }


    log_format main '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    client_max_body_size 128m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # internal health check only (loopback inside the container)
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
    }

    # unknown TLS hostnames never receive a certificate
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
