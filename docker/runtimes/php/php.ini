expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 128M
post_max_size = 130M
max_execution_time = 60
date.timezone = UTC
session.save_path = /tmp
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
allow_url_include = Off
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
