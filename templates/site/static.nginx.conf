# Generated by WebManager for a static site. Runs as an unprivileged user.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/site/error.log warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 16m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /var/log/site/access.log;

    server {
        listen 8080 default_server;
        root /var/www/site/{{DOCROOT}};
        index index.html index.htm;

        location = /_wm_health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location ~ /\.(?!well-known) { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
