# WebManager – production stack.
# All values come from .env (generated by install.sh, mode 0600). No secrets live in this file.
# Images are built locally from this tree (WM_IMAGE_PREFIX=drimzo) or pulled when
# WM_IMAGE_PREFIX points to a registry that hosts matching, version-tagged images.
name: webmanager

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *hardening
    image: mariadb:11.4.13
    container_name: wm-db
    # MariaDB's entrypoint starts as root and drops to the mysql user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME missing in .env}
      MARIADB_USER: ${DB_USER:?DB_USER missing in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing in .env}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    volumes:
      - db_data:/var/lib/mysql
    networks: [db]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    pids_limit: 512
    mem_limit: 1g

  agent:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    image: ${WM_IMAGE_PREFIX:-drimzo}/agent:${WM_VERSION:?WM_VERSION missing in .env}
    container_name: wm-agent
    # Needs to chown site directories and to drop to per-site uids for file operations.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    environment:
      DATA_DIR: ${DATA_DIR:?DATA_DIR missing in .env}
      AGENT_TOKEN_DASHBOARD: ${AGENT_TOKEN_DASHBOARD:?missing in .env}
      AGENT_TOKEN_WORKER: ${AGENT_TOKEN_WORKER:?missing in .env}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      PUBLIC_IPS: ${PUBLIC_IPS:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CONSOLE: ${CONSOLE:-on}
      CONSOLE_TICKETS: ${CONSOLE_TICKETS:-worker}
      SITE_NET_POOL: ${SITE_NET_POOL:-10.210}
      DB_BIND_ADDRESS: ${DB_BIND_ADDRESS:-${BIND_ADDRESS:-0.0.0.0}}
      WM_VERSION: ${WM_VERSION}
      TZ: ${TZ:-UTC}
    volumes:
      # The Docker socket is only mounted into this container, never into the dashboard or into websites.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same absolute path inside and outside: bind mounts created through the socket use host paths.
      - ${DATA_DIR}:${DATA_DIR}
      - ${INSTALL_DIR:?INSTALL_DIR missing in .env}/templates:/opt/wm/templates:ro
      - ${INSTALL_DIR}/docker/runtimes:/opt/wm/runtimes:ro
      - ${LOG_DIR:?LOG_DIR missing in .env}:/var/log/wm
    networks: [mgmt, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    pids_limit: 512
    mem_limit: 512m

  worker:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: ${WM_IMAGE_PREFIX:-drimzo}/worker:${WM_VERSION}
    container_name: wm-worker
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m,mode=1777
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY:?APP_KEY missing in .env}
      AGENT_URL: http://agent:9000
      AGENT_TOKEN_WORKER: ${AGENT_TOKEN_WORKER}
      CONSOLE_TICKETS: ${CONSOLE_TICKETS:-worker}
      TZ: ${TZ:-UTC}
    networks: [db, mgmt, egress]
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    pids_limit: 256
    mem_limit: 512m

  webmanager:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/webmanager/Dockerfile
    image: ${WM_IMAGE_PREFIX:-drimzo}/webmanager:${WM_VERSION}
    container_name: webmanager
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m,mode=1777
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      AGENT_URL: http://agent:9000
      AGENT_TOKEN_DASHBOARD: ${AGENT_TOKEN_DASHBOARD}
      CONSOLE_TICKETS: ${CONSOLE_TICKETS:-worker}
      TZ: ${TZ:-UTC}
    networks: [frontend, db, mgmt]
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    pids_limit: 256
    mem_limit: 512m

  proxy:
    <<: *hardening
    build:
      context: docker/proxy
    image: ${WM_IMAGE_PREFIX:-drimzo}/proxy:${WM_VERSION}
    container_name: wm-proxy
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
      - /var/cache/nginx:rw,nosuid,size=64m
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${DATA_DIR}/runtime/proxy/conf.d:/etc/nginx/conf.d:ro
      - ${DATA_DIR}/letsencrypt:/etc/letsencrypt:ro
      - ${DATA_DIR}/runtime/acme:/var/www/acme:ro
    # Per-website networks are attached by the agent at runtime (docker network connect).
    networks: [frontend, mgmt]
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 512
    mem_limit: 512m

networks:
  frontend:
    name: wm-frontend
  db:
    name: wm-db
    internal: true
  mgmt:
    name: wm-mgmt
    internal: true
  egress:
    name: wm-egress

volumes:
  db_data:
    name: wm_db_data
